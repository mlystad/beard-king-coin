<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nothing here, sir | Beard King</title>
<meta name="description" content="That page does not exist, or it has moved.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0B0D">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
    --raven: #0A0B0D;
    --soot: #121418;
    --salt: #CDD1D7;
    --bone: #F3EEE4;
    --ginger: #DD7A35;
    --ember: #F4AE6C;
    --display: 'Bricolage Grotesque', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --body: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;
    --voice: 'Instrument Serif', Georgia, 'Times New Roman', serif;
    color-scheme: dark;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
    min-height: 100vh; display: grid; place-items: center; padding: 48px 20px;
    background: var(--raven); color: var(--salt);
    font-family: var(--body); font-size: 1.0625rem; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
main { width: 100%; max-width: 34rem; }
.voice { font-family: var(--voice); font-style: italic; font-weight: 400; color: var(--ginger); text-transform: none; display: block; letter-spacing: -0.02em; }
h1 {
    font-family: var(--display); font-weight: 800; font-stretch: 75%; text-transform: uppercase;
    font-size: clamp(2.6rem, 15vw, 5.5rem); line-height: 0.9; letter-spacing: -0.01em; color: var(--bone);
    margin-bottom: 24px;
}
p { margin-bottom: 32px; }
.btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px;
    font-family: var(--display); font-weight: 700; font-stretch: 85%; font-size: 1rem; letter-spacing: 0.06em;
    text-transform: uppercase; text-decoration: none; white-space: nowrap;
    border: 2px solid var(--ginger); border-radius: 999px; background: var(--ginger); color: var(--raven);
}
.btn:hover { background: var(--ember); border-color: var(--ember); }
</style>
</head>
<body>
<main id="main">
    <h1>Nothing here, <span class="voice">sir.</span></h1>
    <p>That page does not exist, or it has moved. The coin is waiting at the front door.</p>
    <a class="btn" href="/">Back to the coin</a>
</main>
</body>
</html>
